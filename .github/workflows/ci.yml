name: CI

on:
  push:
    branches: [ main, master, dev, deploy/cloud ]
  pull_request:
    branches: [ main, master, dev, deploy/cloud ]

jobs:
  backend-test:
    name: Backend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      - name: Typecheck
        run: |
          cd backend
          npm run typecheck

  mobile-lint:
    name: Mobile Flutter Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.x'   # ให้ตรงกับที่ทีมใช้จริง (เดิม 3.19.x เก่าเกิน)

      - name: Get packages
        run: |
          cd mobile
          flutter pub get

      # --no-fatal-infos: ตอนนี้โปรเจกต์มี info ~180 ตัว (พวก withOpacity deprecated)
      # แต่ error/warning = 0 → ให้ CI แดงเฉพาะตอนมีปัญหาจริง ไม่ใช่แดงตลอด
      - name: Run analyzer
        run: |
          cd mobile
          flutter analyze --no-fatal-infos

# Render Blueprint — deploy backend "พี่เงิน" (เสิร์ฟทั้ง API + web PWA ที่ origin เดียว)
# ใช้: Render → New → Blueprint → เลือก repo นี้ → Apply → แล้วตั้งค่า secret (sync:false) ใน dashboard
services:
  - type: web
    name: phee-ngern
    runtime: node
    rootDir: backend
    plan: free
    region: singapore
    # --include=dev: บังคับลง devDependencies (@types, typescript, tsx) แม้ NODE_ENV=production
    buildCommand: npm install --include=dev && npm run render-build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: NOTIF_CRON
        value: "off"
      # ชี้ไป Python Prophet service (service phee-ngern-ai ด้านล่าง) — ถ้าชื่อ host ต่างให้แก้ใน dashboard
      - key: PREDICTION_API_URL
        value: https://phee-ngern-ai.onrender.com/predict
      # โดเมนเว็บ/PWA (backend เสิร์ฟ same-origin) — ใช้ทำ redirect กลับหลัง OAuth
      - key: WEB_APP_URL
        value: https://phee-ngern.onrender.com
      # Facebook server-side OAuth (iOS Safari บล็อก FB JS SDK จึงต้อง redirect flow)
      - key: FACEBOOK_APP_ID
        value: "1737272337424131"
      - key: FACEBOOK_APP_SECRET   # ตั้งใน dashboard (ความลับ — ห้ามเก็บใน repo)
        sync: false
      # ── secret: ตั้งค่าใน Render dashboard (ไม่เก็บใน repo) ──
      - key: DATABASE_URL          # จาก Neon Postgres (connection string)
        sync: false
      - key: JWT_SECRET            # Render สุ่มให้อัตโนมัติ
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID      # web client id ของ phee-ngern (+ Gmail client คั่น ,)
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TYPHOON_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT   # วาง JSON ของ service account ทั้งก้อน
        sync: false

  # ── AI Forecasting (Prophet) — FastAPI แยกอีก service (ไม่ต้องมี secret) ──
  # backend เรียกผ่าน PREDICTION_API_URL ข้างบน · fail soft: ถ้า service นี้ล่ม/หลับ → พยากรณ์ข้ามเงียบ ๆ
  - type: web
    name: phee-ngern-ai
    runtime: python
    rootDir: ai/predictions
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION      # prophet 1.1.6 มี wheel ถึง cp312 — ตรึง 3.11 กัน build จาก source
        value: "3.11.9"

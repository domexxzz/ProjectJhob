org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# ปลั๊กอินเก่า (flutter_facebook_auth 6.x) ตั้ง Java=11 แต่ Kotlin=17 → AGP 9 มองเป็น
# error "Inconsistent JVM-target". ลดเป็น warning: bytecode ต่างเวอร์ชันในโมดูลเดียว
# D8 dex รวมได้ปกติ (ทางออกที่ Kotlin Gradle plugin เตรียมไว้สำหรับเคสนี้)
kotlin.jvm.target.validation.mode=warning
# ปิด Kotlin incremental compile — Build Tools API รุ่นใหม่ปิด cache ไม่ลงบน Windows
# ("Could not close incremental caches") build เต็มทุกครั้งช้ากว่านิดแต่ไม่พังค้าง
kotlin.incremental=false
